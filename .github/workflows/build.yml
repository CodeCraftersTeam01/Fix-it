name: Build App (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
      - '*beta*'

jobs:
  build-windows:
    name: Build Windows (.exe Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Windows Installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows Standalone Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: FixIt-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/fixit.exe

  build-macos:
    name: Build macOS (.dmg Installer)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build macOS DMG
        run: npx tauri build --bundles dmg

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: FixIt-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg

  publish-release:
    name: Publish GitHub Release (Direct DMG & EXE)
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: FixIt-Windows-Installer
          path: windows-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: FixIt-macOS-DMG
          path: macos-release

      - name: Publish Direct Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FixIt ${{ github.ref_name }}"
          files: |
            windows-release/*.exe
            macos-release/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
